<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="keywords" content="Muhammad Abdullah Sultan, portfolio, Computer Engineer, Machine Learning, Networking, Embedded Systems" />
  <meta name="description" content="Portfolio of Muhammad Abdullah Sultan - Computer Engineer | Networking & Machine Learning Specialist" />
  <link rel="shortcut icon" href="./assets/images/favicon.jpg" type="image/x-jpg" />
  <title>Portfolio | Muhammad Abdullah Sultan</title>

  <!-- CDN for React, ReactDOM, and Babel -->
  <script src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.22.9/babel.min.js"></script>

  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Font Awesome for Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" crossorigin="anonymous" />

  <!-- AOS for Scroll Animations -->
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet" />
  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>

  <!-- Typed.js for Typewriter Effect -->
  <script src="https://cdn.jsdelivr.net/npm/typed.js@2.0.12"></script>

  <style>
    /* Custom Tailwind Configurations */
    .glass {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    .float {
      animation: float 6s ease-in-out infinite;
    }
    @keyframes float {
      0% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
      100% { transform: translateY(0); }
    }
    /* Smooth Scroll Behavior */
    html {
      scroll-behavior: smooth;
    }
    /* Dark Mode Styles */
    .dark .glass {
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .dark .btn-primary {
      background: linear-gradient(to right, #1e3a8a, #3b82f6);
    }
    .dark .btn-secondary {
      border-color: #3b82f6;
      color: #93c5fd;
    }
    .dark .btn-secondary:hover {
      background: rgba(59, 130, 246, 0.1);
    }
    .dark .social-icon {
      color: #93c5fd;
    }
    .dark .social-icon:hover {
      background: #1e3a8a;
      color: #ffffff;
    }
    body.dark {
      background-color: #000 !important;
    }
    /* Sections and boxes in dark mode */
    .dark .glass,
    .dark .bg-white,
    .dark .dark\:bg-gray-900,
    .dark .rounded-lg {
      background-color: #23272f !important; /* dark grey */
      border-color: rgba(255,255,255,0.08);
    }
  </style>
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-900 dark:text-gray-100 min-h-screen font-sans">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // Navigation Component
    const Navbar = () => {
      const [isOpen, setIsOpen] = useState(false);
      const [darkMode, setDarkMode] = useState(false);

      useEffect(() => {
        if (darkMode) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      }, [darkMode]);

      const toggleMenu = () => setIsOpen(!isOpen);

      const handleDarkModeToggle = () => {
        setDarkMode(!darkMode);
        // Redirect to home section
        setTimeout(() => {
          document.querySelector('#home').scrollIntoView({ behavior: 'smooth', block: 'start' });
        }, 100);
      };

      const navLinks = [
        { href: "#home", label: "Home" },
        { href: "#about", label: "About" },
        { href: "#skills", label: "Skills" },
        { href: "#education", label: "Education" },
        { href: "#projects", label: "Projects" },
        { href: "#experience", label: "Experience" },
        { href: "#contact", label: "Contact" },
      ];

      const handleNavClick = (e, href) => {
        e.preventDefault();
        document.querySelector(href).scrollIntoView({ behavior: 'smooth', block: 'start' });
        setIsOpen(false);
      };

      return (
        <header className="sticky top-0 z-50 glass">
          <div className="max-w-6xl mx-auto px-  4 py-4 flex justify-between items-center">
            <a href="#home" className="flex items-center gap-2 text-blue-600 dark:text-blue-300 font-bold">
              <span className="w-10 h-10 bg-gradient-to-r from-blue-600 to-blue-400 dark:from-blue-800 dark:to-blue-600 text-white rounded-lg flex items-center justify-center font-extrabold">MAS</span>
              <div>
                <div className="text-sm">Muhammad Abdullah Sultan</div>
                <div className="text-xs text-gray-600 dark:text-gray-300">Computer Engineer</div>
              </div>
            </a>
            <nav className="hidden md:flex gap-4 items-center">
              {navLinks.map((link) => (
                <a
                  key={link.href}
                  href={link.href}
                  onClick={(e) => handleNavClick(e, link.href)}
                  className="text-gray-600 dark:text-gray-200 hover:text-blue-600 dark:hover:text-blue-300 px-2 py-1 rounded-lg hover:bg-blue-50 dark:hover:bg-gray-700 transition-all"
                >
                  {link.label}
                </a>
              ))}
              <button
                onClick={handleDarkModeToggle}
                className="p-2 rounded-full hover:bg-blue-50 dark:hover:bg-gray-700"
              >
                <i className={`fas ${darkMode ? 'fa-sun' : 'fa-moon'} text-blue-600 dark:text-blue-300`}></i>
              </button>
            </nav>
            <button className="md:hidden p-2" onClick={toggleMenu}>
              <i className="fas fa-bars text-blue-600 dark:text-blue-300"></i>
            </button>
          </div>
          {isOpen && (
            <div className="md:hidden bg-white dark:bg-gray-900 px-4 py-2">
              {navLinks.map((link) => (
                <a
                  key={link.href}
                  href={link.href}
                  onClick={(e) => handleNavClick(e, link.href)}
                  className="block py-2 text-gray-600 dark:text-gray-200 hover:text-blue-600 dark:hover:text-blue-300"
                >
                  {link.label}
                </a>
              ))}
              <button
                onClick={handleDarkModeToggle}
                className="block py-2 text-blue-600 dark:text-blue-300"
              >
                {darkMode ? 'Light Mode' : 'Dark Mode'}
              </button>
            </div>
          )}
        </header>
      );
    };

    // Hero Component
    const Hero = () => {
      useEffect(() => {
        const typed = new Typed('#typed', {
          strings: ['Machine Learning', 'Network Security', 'Embedded Systems', 'Full-stack Development'],
          typeSpeed: 90,
          backSpeed: 40,
          loop: true,
        });
        return () => typed.destroy();
      }, []);

      return (
        <section id="home" className="py-16 px-4 max-w-6xl mx-auto flex flex-col md:flex-row gap-8 items-center">
          <div className="flex-1" data-aos="fade-up" data-aos-duration="800">
            <h1 className="text-3xl md:text-4xl font-extrabold text-blue-600 dark:text-blue-300">
              Hi there — I'm <span className="text-blue-400 dark:text-blue-200">Abdullah</span> Sultan
            </h1>
            <p className="text-gray-600 dark:text-gray-200 mt-2">
              Computer Engineer • <span id="typed"></span> • Networking • Embedded Systems
            </p>
            <div className="flex gap-4 mt-4">
              <a href="#projects" className="btn btn-primary bg-gradient-to-r from-blue-600 to-blue-400 dark:from-blue-800 dark:to-blue-600 text-white px-4 py-2 rounded-lg shadow-lg hover:shadow-xl hover:-translate-y-1 transition-all">
                <i className="fas fa-rocket mr-2"></i> Explore Projects

              <a href="#contact" className="btn btn-secondary border border-blue-600 dark:border-blue-600 text-blue-600 dark:text-blue-300 px-4 py-2 rounded-lg hover:bg-blue-50 dark:hover:bg-blue-900/20 transition-all">
                <i className="fas fa-paper-plane mr-2"></i> Get In Touch
              </a>
            </div>
            <div className="flex gap-4 mt-4" data-aos="fade-right" data-aos-delay="120">
              <a href="https://www.linkedin.com/in/mabdullah-sultan" target="_blank" className="w-10 h-10 glass rounded-lg flex items-center justify-center social-icon text-blue-600 dark:text-blue-300 hover:bg-blue-600 dark:hover:bg-blue-800 hover:text-white transition-all">
                <i className="fab fa-linkedin"></i>
              </a>
              <a href="https://github.com/Abdullah-Gujjar9" target="_blank" className="w-10 h-10 glass rounded-lg flex items-center justify-center social-icon text-blue-600 dark:text-blue-300 hover:bg-blue-600 dark:hover:bg-blue-800 hover:text-white transition-all">
                <i className="fab fa-github"></i>
              </a>
              <a href="mailto:abdullah.s1045g@gmail.com" className="w-10 h-10 glass rounded-lg flex items-center justify-center social-icon text-blue-600 dark:text-blue-300 hover:bg-blue-600 dark:hover:bg-blue-800 hover:text-white transition-all">
                <i className="fas fa-envelope"></i>
              </a>
            </div>
          </div>
          <div className="w-full md:w-2/5" data-aos="zoom-in" data-aos-duration="900">
            <div className="glass rounded-2xl p-4 shadow-lg hover:-translate-y-2 hover:-rotate-1 transition-all">
              <img src="./assets/images/myhero.png" alt="Hero Illustration" className="w-full h-auto rounded-lg" loading="lazy" />
            </div>
          </div>
        </section>
      );
    };

    // About Component
    const About = () => (
      <section id="about" className="py-10 px-4 max-w-6xl mx-auto bg-white dark:bg-gray-900 rounded-lg" data-aos="fade-up" data-aos-duration="800">
        <h2 className="text-xl font-bold text-blue-600 dark:text-blue-300 flex items-center gap-2">
          <i className="fas fa-user-alt text-blue-400 dark:text-blue-200"></i> About <strong>Me</strong>
        </h2>
        <div className="grid grid-cols-1 md:grid-cols-2 gap-6 mt-4">
          <div className="glass rounded-lg p-4 flex flex-col items-center" data-aos="fade-right" data-aos-delay="120">
            <img src="./assets/images/myphoto.jpg" alt="Profile photo of Muhammad Abdullah Sultan" className="w-56 h-56 object-cover rounded-lg shadow-lg float" loading="lazy" />
            <div className="text-center mt-4">
              <h3 className="text-lg font-bold text-blue-600 dark:text-blue-300">Muhammad Abdullah Sultan</h3>
              <div className="text-blue-400 dark:text-blue-200 font-semibold">Computer Engineer • ML & Networking Specialist</div>
            </div>
          </div>
          <div className="text-gray-600 dark:text-gray-200" data-aos="fade-left" data-aos-delay="160">
            <p>
              I graduated from UET Taxila in Computer Engineering and focus on Machine Learning model development, secure network design, and embedded systems. I build production-ready ML pipelines, REST APIs, and interdisciplinary embedded projects (Arduino, sensors).
            </p>
            <div className="flex flex-wrap gap-4 mt-4">
              <div className="glass rounded-lg p-2 flex items-center gap-2">
                <i className="fas fa-envelope text-blue-400 dark:text-blue-200"></i>
                <span className="text-sm">abdullah.s1045g@gmail.com</span>
              </div>
              <div className="glass rounded-lg p-2 flex items-center gap-2">
                <i className="fas fa-map-marker-alt text-blue-400 dark:text-blue-200"></i>
                <span className="text-sm">Pakistan</span>
              </div>
              <div className="glass rounded-lg p-2 flex items-center gap-2">
                <i className="fas fa-graduation-cap text-blue-400 dark:text-blue-200"></i>
                <span className="text-sm">UET Taxila</span>
              </div>
            </div>
            <div className="flex gap-4 mt-4">
              <a href="./assets/files/resume.pdf" target="_blank" className="btn btn-primary bg-gradient-to-r from-blue-600 to-blue-400 dark:from-blue-800 dark:to-blue-600 text-white px-4 py-2 rounded-lg shadow-lg hover:shadow-xl hover:-translate-y-1 transition-all">
                <i className="fas fa-download mr-2"></i> Download Resume
              </a>
              <a href="#projects" className="btn btn-secondary border border-blue-600 dark:border-blue-600 text-blue-600 dark:text-blue-300 px-4 py-2 rounded-lg hover:bg-blue-50 dark:hover:bg-blue-900/20 transition-all">
                <i className="fas fa-folder-open mr-2"></i> View Work
              </a>
            </div>
          </div>
        </div>
      </section>
    );

    // Skills Component
    const Skills = () => {
      const skills = [
        { icon: "fas fa-code", title: "Programming", description: "Python · JavaScript · HTML/CSS · SQL" },
        { icon: "fas fa-brain", title: "Machine Learning", description: "TensorFlow · Scikit-learn · Model Deployment · Feature Engineering" },
        { icon: "fas fa-network-wired", title: "Networking", description: "TCP/IP · VPN · DNS · Subnetting · Wireshark · Network Security" },
        { icon: "fas fa-robot", title: "Embedded Systems", description: "Arduino · Sensors · Gesture Recognition · Assembly basics" },
        { icon: "fas fa-tools", title: "Tools & Platforms", description: "Git · Docker · Flask · Linux · Jupyter" },
        { icon: "fas fa-database", title: "Databases", description: "MongoDB · MySQL · SQLite" },
      ];

      return (
        <section id="skills" className="py-10 px-4 max-w-6xl mx-auto" data-aos="fade-up" data-aos-duration="800">
          <h2 className="text-xl font-bold text-blue-600 dark:text-blue-300 flex items-center gap-2">
            <i className="fas fa-laptop-code text-blue-400 dark:text-blue-200"></i> Skills & <strong>Abilities</strong>
          </h2>
          <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 mt-4">
            {skills.map((skill, index) => (
              <div key={skill.title} className="glass rounded-lg p-4 hover:shadow-lg hover:-translate-y-2 transition-all" data-aos="zoom-in" data-aos-delay={60 + index * 40}>
                <div className="flex items-center gap-2">
                  <i className={`${skill.icon} text-blue-400 dark:text-blue-200 text-xl`}></i>
                  <h4 className="text-blue-600 dark:text-blue-300 font-semibold">{skill.title}</h4>
                </div>
                <p className="text-gray-600 dark:text-gray-200 mt-2">{skill.description}</p>
              </div>
            ))}
          </div>
        </section>
      );
    };

    // Education Component
    const Education = () => (
      <section id="education" className="py-10 px-4 max-w-6xl mx-auto" data-aos="fade-up" data-aos-duration="800">
        <h2 className="text-xl font-bold text-blue-600 dark:text-blue-300 flex items-center gap-2">
          <i className="fas fa-graduation-cap text-blue-400 dark:text-blue-200"></i> Education
        </h2>
        <div className="grid grid-cols-1 gap-4 mt-4">
          <div className="glass rounded-lg p-4 hover:shadow-lg hover:-translate-y-2 transition-all" data-aos="flip-left" data-aos-delay="80">
            <h3 className="text-blue-600 dark:text-blue-300 font-semibold">Bachelor of Science in Computer Engineering</h3>
            <p className="text-gray-600 dark:text-gray-200">University of Engineering and Technology, Taxila</p>
            <p className="text-gray-500 dark:text-gray-300 text-sm">Nov 2021 – May 2025</p>
          </div>
        </div>
      </section>
    );

    // Projects Component
    const Projects = () => {
      const projects = [
        { icon: "fas fa-bed", title: "Sleep Stage Detection Using EEG", description: "Achieved 87% accuracy in classifying sleep phases using TensorFlow and optimized pipelines for 5,000+ EEG samples." },
        { icon: "fas fa-seedling", title: "Plant Disease Detection App (FYP)", description: "ML-integrated Flutter app with multiple CNN models and real-time detection. Backend deployed via Flask + Docker." },
        { icon: "fas fa-car", title: "Multifunctional Robotic Car", description: "Arduino-based vehicle with obstacle avoidance, line-following and gesture recognition using multiple sensors." },
      ];

      return (
        <section id="projects" className="py-10 px-4 max-w-6xl mx-auto" data-aos="fade-up" data-aos-duration="800">
          <h2 className="text-xl font-bold text-blue-600 dark:text-blue-300 flex items-center gap-2">
            <i className="fas fa-folder-open text-blue-400 dark:text-blue-200"></i> Projects
          </h2>
          <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 mt-4">
            {projects.map((project, index) => (
              <div key={project.title} className="glass rounded-lg p-4 hover:shadow-lg hover:-translate-y-2 transition-all" data-aos="fade-up" data-aos-delay={60 + index * 60}>
                <div className="flex items-center gap-2">
                  <i className={`${project.icon} text-blue-600 dark:text-blue-300`}></i>
                  <h3 className="text-blue-600 dark:text-blue-300 font-semibold">{project.title}</h3>
                </div>
                <p className="text-gray-600 dark:text-gray-200 mt-2">{project.description}</p>
              </div>
            ))}
          </div>
        </section>
      );
    };

    // Experience Component
    const Experience = () => {
      const experiences = [
        {
          title: "Python Programming Intern — A&D Tech Innovations",
          duration: "Jun 2024 – Aug 2024 | Remote",
          description: "Built desktop apps using Python & Tkinter, improved efficiency by ~40% and implemented modular OOP patterns for maintainability.",
        },
        {
          title: "Backend Developer Intern — Neuron Tech",
          duration: "Mar 2024 – Jun 2024 | Remote",
          description: "Developed full-stack features (React/Node), secured flows with Firebase Auth & Firestore, and worked on LLM data pipelines and tests.",
        },
      ];

      return (
        <section id="experience" className="py-10 px-4 max-w-6xl mx-auto" data-aos="fade-up" data-aos-duration="800">
          <h2 className="text-xl font-bold text-blue-600 dark:text-blue-300 flex items-center gap-2">
            <i className="fas fa-briefcase text-blue-400 dark:text-blue-200"></i> Experience
          </h2>
          <div className="flex flex-col gap-4 mt-4">
            {experiences.map((exp, index) => (
              <div key={exp.title} className="glass rounded-lg p-4 hover:shadow-lg hover:-translate-y-2 transition-all" data-aos="fade-right" data-aos-delay={80 + index * 60}>
                <h3 className="text-blue-600 dark:text-blue-300 font-semibold">{exp.title}</h3>
                <p className="text-gray-500 dark:text-gray-300 text-sm">{exp.duration}</p>
                <p className="text-gray-600 dark:text-gray-200 mt-2">{exp.description}</p>
              </div>
            ))}
          </div>
        </section>
      );
    };

    // Contact Component
    const Contact = () => {
      const [formData, setFormData] = useState({ name: '', email: '', message: '' });
      const [message, setMessage] = useState({ text: '', bgColor: '', textColor: '' });
      const [showMessage, setShowMessage] = useState(false);

      const handleChange = (e) => {
        setFormData({ ...formData, [e.target.name]: e.target.value });
      };

      const handleSubmit = async (e) => {
        e.preventDefault();
        setMessage({ text: '⏳ Sending your message...', bgColor: '#e5e7eb', textColor: '#1f2937' });
        setShowMessage(true);

        try {
          const response = await fetch('https://formspree.io/f/mkgzaqkg', {
            method: 'POST',
            headers: { 'Accept': 'application/json', 'Content-Type': 'application/json' },
            body: JSON.stringify(formData),
          });

          if (response.ok) {
            setMessage({ text: '✅ Thanks for contacting! I’ll get back to you soon.', bgColor: '#d4edda', textColor: '#155724' });
            setFormData({ name: '', email: '', message: '' });
            setTimeout(() => setShowMessage(false), 4000);
          } else {
            setMessage({ text: '❌ Oops! Something went wrong. Please try again.', bgColor: '#f8d7da', textColor: '#721c24' });
          }
        } catch (error) {
          setMessage({ text: `⚠️ Error: ${error.message}`, bgColor: '#fff3cd', textColor: '#856404' });
        }
      };

      return (
        <section id="contact" className="py-10 px-4 max-w-6xl mx-auto bg-white dark:bg-gray-900 rounded-lg" data-aos="fade-up" data-aos-duration="800">
          <h2 className="text-xl font-bold text-blue-600 dark:text-blue-300 flex items-center gap-2">

          </h2>
          <div className="grid grid-cols-1 md:grid-cols-2 gap-6 mt-4">
            <div className="glass rounded-lg p-4 flex flex-col gap-4" data-aos="fade-right" data-aos-delay="60">
              <div className="flex items-center gap-2">
                <i className="fas fa-envelope text-blue-400 dark:text-blue-200 text-lg"></i>
                <div>
                  <h4 className="text-blue-600 dark:text-blue-300 font-semibold">Email</h4>
                  <a href="mailto:abdullah.s1045g@gmail.com" className="text-gray-600 dark:text-gray-200 text-sm hover:text-blue-600 dark:hover:text-blue-300">abdullah.s1045g@gmail.com</a>
                </div>
              </div>
              <div className="flex items-center gap-2">
                <i className="fab fa-linkedin text-blue-400 dark:text-blue-200 text-lg"></i>
                <div>
                  <h4 className="text-blue-600 dark:text-blue-300 font-semibold">LinkedIn</h4>
                  <a href="https://www.linkedin.com/in/mabdullah-sultan" target="_blank" className="text-gray-600 dark:text-gray-200 text-sm hover:text-blue-600 dark:hover:text-blue-300">linkedin.com/in/mabdullah-sultan</a>
                </div>
              </div>
              <div className="flex items-center gap-2">
                <i className="fab fa-github text-blue-400 dark:text-blue-200 text-lg"></i>
                <div>
                  <h4 className="text-blue-600 dark:text-blue-300 font-semibold">GitHub</h4>
                  <a href="https://github.com/Abdullah-Gujjar9" target="_blank" className="text-gray-600 dark:text-gray-200 text-sm hover:text-blue-600 dark:hover:text-blue-300">github.com/Abdullah-Gujjar9</a>
                </div>
              </div>
            </div>
            <form onSubmit={handleSubmit} className="glass rounded-lg p-4" data-aos="fade-left" data-aos-delay="100">
              <div className="flex flex-col sm:flex-row gap-4">
                <div className="flex-1">
                  <label htmlFor="name" className="text-sm text-gray-600 dark:text-gray-200">Name</label>
                  <input
                    type="text"
                    id="name"
                    name="name"
                    value={formData.name}
                    onChange={handleChange}
                    placeholder="Your name"
                    required
                    className="w-full p-3 rounded-lg border border-gray-200 dark:border-gray-700 bg-transparent text-gray-900 dark:text-gray-100 focus:ring-2 focus:ring-blue-600 dark:focus:ring-blue-300 transition-all"
                  />
                </div>
                <div className="flex-1">
                  <label htmlFor="email" className="text-sm text-gray-600 dark:text-gray-200">Email</label>
                  <input
                    type="email"
                    id="email"
                    name="email"
                    value={formData.email}
                    onChange={handleChange}
                    placeholder="Your email"
                    required
                    className="w-full p-3 rounded-lg border border-gray-200 dark:border-gray-700 bg-transparent text-gray-900 dark:text-gray-100 focus:ring-2 focus:ring-blue-600 dark:focus:ring-blue-300 transition-all"
                  />
                </div>
              </div>
              <div className="mt-4">
                <label htmlFor="message" className="text-sm text-gray-600 dark:text-gray-200">Message</label>
                <textarea
                  id="message"
                  name="message"
                  value={formData.message}
                  onChange={handleChange}
                  rows="6"
                  placeholder="Describe your message..."
                  required
                  className="w-full p-3 rounded-lg border border-gray-200 dark:border-gray-700 bg-transparent text-gray-900 dark:text-gray-100 focus:ring-2 focus:ring-blue-600 dark:focus:ring-blue-300 transition-all resize-vertical"
                ></textarea>
              </div>
              <div className="flex gap-4 mt-4">
                <button type="submit" className="btn btn-primary bg-gradient-to-r from-blue-600 to-blue-400 dark:from-blue-800 dark:to-blue-600 text-white px-4 py-2 rounded-lg shadow-lg hover:shadow-xl hover:-translate-y-1 transition-all">
                  <i className="fas fa-paper-plane mr-2"></i> Send Message
                </button>
                <button type="reset" onClick={() => setFormData({ name: '', email: '', message: '' })} className="btn btn-secondary border border-blue-600 dark:border-blue-600 text-blue-600 dark:text-blue-300 px-4 py-2 rounded-lg hover:bg-blue-50 dark:hover:bg-blue-900/20 transition-all">
                  Reset
                </button>
              </div>
              {showMessage && (
                <div className="mt-4 p-2 rounded-lg transition-opacity duration-600" style={{ background: message.bgColor, color: message.textColor, opacity: showMessage ? 1 : 0 }}>
                  {message.text}
                </div>
              )}
            </form>
          </div>
        </section>
      );
    };

    // Footer Component
    const Footer = () => (
      <footer className="py-10 px-4 max-w-6xl mx-auto text-center text-gray-600 dark:text-gray-300 border-t border-gray-200 dark:border-gray-700">
        <p className="text-sm">© {new Date().getFullYear()} Muhammad Abdullah Sultan</p>
      </footer>
    );

    // Main App Component
    const App = () => {
      useEffect(() => {
        AOS.init({ once: true, duration: 700, easing: 'cubic-bezier(.2,.8,.2,1)' });
      }, []);

      return (
        <div>
          <Navbar />
          <main>
            <Hero />
            <About />
            <Skills />
            <Education />
            <Projects />
            <Experience />
            <Contact />
          </main>
          <Footer />
        </div>
      );
    };

    // Render the App
    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
  <script>
  // Disable right click
  document.addEventListener('contextmenu', event => event.preventDefault());

  // Disable common inspect shortcuts
  document.onkeydown = function(e) {
    if (e.keyCode == 123) { // F12
      return false;
    }
    if (e.ctrlKey && e.shiftKey && (e.keyCode == 'I'.charCodeAt(0) || e.keyCode == 'J'.charCodeAt(0))) {
      return false;
    }
    if (e.ctrlKey && e.keyCode == 'U'.charCodeAt(0)) { // Ctrl+U
      return false;
    }
  }
</script>

</body>
</html>
